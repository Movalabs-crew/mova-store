name: CI

# Supply-chain policy: every third-party `uses:` below is pinned to a full
# 40-character commit SHA with a `# vX.Y.Z` comment, so moving an upstream tag
# cannot change what runs here without review. The `github-actions` Dependabot
# entry in .github/dependabot.yml proposes the SHA bumps; the `action-pins` job
# (scripts/check-pinned-actions.mjs) fails if a mutable ref is reintroduced.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  # Lets a maintainer run this workflow on any branch in this repository. That is
  # how pull requests opened from forks get verified: GitHub gates their own runs
  # behind an approval step, so the branch is mirrored into this repository and
  # dispatched here instead. Without this, a fork pull request can sit with no CI
  # result at all.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  # soroban-sdk 28 refuses to build a contract with 1.81, 1.82, 1.83 or 1.91.0
  # ("use a rust version other than ..."), and 1.91.0 is what this repo pinned,
  # so the contracts job could not build at all. 1.96.1 is the toolchain the
  # fmt/clippy/test/`stellar contract build` sequence was verified against.
  RUST_VERSION: "1.96.1"
  # soroban-sdk 28 also refuses to build a contract with a bare `cargo build`:
  # it needs stellar-cli >= 25.2.0 to run the spec-shaking step. Pinned here so
  # a cli release cannot silently change the artifact the contracts job checks.
  STELLAR_CLI_VERSION: "28.1.0"

jobs:
  # Frontend checks
  frontend:
    name: Frontend (Lint, Type Check, Test, Build)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check next / eslint-config-next are in step
        run: |
          node -e "const p=require('./package.json');const n=p.dependencies&&p.dependencies.next;const e=p.devDependencies&&p.devDependencies['eslint-config-next'];if(!n||!e){console.error('Both next and eslint-config-next must be declared in package.json');process.exit(1);}if(n!==e){console.error('next ('+n+') and eslint-config-next ('+e+') must be pinned to the same version');process.exit(1);}console.log('next and eslint-config-next are both '+n);"

      # Order matters: a step that fails skips every step after it, so the
      # cheapest signals are reported first. The formatting gate lives in its
      # own (non-blocking) job — see the note there.
      - name: Run ESLint
        run: npm run lint

      - name: Check for case-colliding paths
        run: npm run check:case

      - name: Type check
        run: npm run type-check

      # "vitest run --coverage" executes the whole suite once and collects v8
      # coverage in the same pass, so a separate "npm run test" step would run
      # every test a second time for no extra signal. The coverage thresholds in
      # vitest.config.ts still gate this step.
      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Build Next.js
        run: npm run build
        env:
          # Minimal env vars for build
          NEXT_PUBLIC_STELLAR_NETWORK: testnet
          NEXT_PUBLIC_CHECKOUT_CONTRACT_ID: CDUMMY0000000000000000000000000000000000000000000000000
          NEXT_PUBLIC_SUPABASE_URL: https://dummy.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy_anon_key
          NEXT_PUBLIC_EMAILJS_SERVICE_ID: service_dummy
          NEXT_PUBLIC_EMAILJS_TEMPLATE_ID: template_dummy
          NEXT_PUBLIC_EMAILJS_PUBLIC_KEY: dummy_key

      # Measures what the client actually ships and uploads the report as an
      # artifact. Report mode on purpose: a borderline size must not mask the
      # lint/test signal. Run `npm run bundle:check` to enforce the budget
      # documented in docs/BUNDLE_BUDGET.md.
      - name: Bundle report
        run: npm run bundle:report -- --json bundle-report.json

      - name: Upload bundle report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bundle-report
          path: bundle-report.json
          if-no-files-found: warn

  # Test file naming convention
  test-naming:
    name: Test File Naming
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Enforce test file naming convention
        run: node scripts/check-test-names.mjs

  # Workflow supply-chain pins
  action-pins:
    name: Workflow Action Pins
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Enforce pinned third-party actions
        run: node scripts/check-pinned-actions.mjs

  # Formatting.
  #
  # Also NOT one of ci-success's needs. Prettier drifted across 76 files while
  # this step sat behind the ESLint failure at the end of the frontend job, so
  # it never actually ran. Reformatting all 76 now would rewrite 27 files that
  # open pull requests already touch and would conflict with most of the queue,
  # so the repo-wide pass is tracked as an issue and this check stays red and
  # visible until it lands.
  format:
    name: Format Check (non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check code formatting
        run: npm run format:check
  # Soroban contract checks
  contracts:
    name: Soroban Contracts (Build, Test, Format, Clippy)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: wasm32v1-none
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            contracts/checkout/target/
          key: ${{ runner.os }}-cargo-${{ env.RUST_VERSION }}-${{ hashFiles('contracts/checkout/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ env.RUST_VERSION }}-
            ${{ runner.os }}-cargo-

      - name: Check formatting
        working-directory: contracts/checkout
        run: cargo fmt -- --check

      - name: Run clippy
        working-directory: contracts/checkout
        run: cargo clippy --all-targets -- -D warnings

      # A bare `cargo build --target wasm32v1-none` no longer works: soroban-sdk
      # 28 refuses to build a contract without stellar-cli >= 25.2.0, which it
      # needs to run spec shaking. Install the pinned prebuilt binary rather than
      # `cargo install`, which would add many minutes to every run.
      - name: Install stellar-cli
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSfL "https://github.com/stellar/stellar-cli/releases/download/v${STELLAR_CLI_VERSION}/stellar-cli-${STELLAR_CLI_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "$HOME/.local/bin" stellar
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/stellar" --version

      - name: Build contracts
        working-directory: contracts/checkout
        run: |
          stellar contract build
          ls -l target/wasm32v1-none/release/*.wasm


      - name: Run contract tests
        working-directory: contracts/checkout
        run: cargo test

  # Secret scanning. This one gates: a leaked credential must stop a merge.
  security:
    name: Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # trufflehog walks the full history; the default shallow checkout only
          # exposes the tip, so a secret committed and later removed would pass.
          fetch-depth: 0

      - name: Check for secrets
        uses: trufflesecurity/trufflehog@363923b901c911a9164f50b6c423f47c15372b1c # v3.97.4
        with:
          extra_args: --only-verified

  # Dependency advisories.
  #
  # Deliberately NOT one of ci-success's needs. Every advisory reported here
  # (axios, esbuild, glob, next, postcss) is only fixable by a breaking major,
  # and `next` is flagged critical with next 16 as the only remedy. A required
  # check that cannot pass on any commit protects nothing; it just wedges the
  # queue, because `main` inherits the failure and no pull request can go green.
  # So this job stays red and visible while the upgrade is tracked as an issue.
  dependency-audit:
    name: Dependency Audit (non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Check for secrets
        uses: trufflesecurity/trufflehog@363923b901c911a9164f50b6c423f47c15372b1c # v3.97.4
        with:
          extra_args: --only-verified
  # Rust security audit
  rust-security:
    name: Rust Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Install cargo-audit
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-audit

      # A security gate that cannot fail is documentation, not a control.
      # rust-security is one of ci-success's needs, so an advisory found here
      # must fail the job. Tolerate a specific advisory only by adding an
      # explicit `--ignore <RUSTSEC-id>` with a comment saying why.
      - name: Run cargo audit
        working-directory: contracts/checkout
        run: cargo audit

  # Workflow YAML lint
  #
  # A duplicate `concurrency:` key silently disabled CI for two weeks: every run
  # failed at 0s and no job executed because nothing validated the workflow file
  # itself. actionlint parses .github/workflows/*.yml and fails on duplicate keys,
  # unknown keys and syntax/expression errors, so this class of mistake surfaces as
  # a red check instead of a silent no-op. Shellcheck is deliberately disabled
  # (`-shellcheck=`) to keep this a pure workflow-YAML gate — the frontend and
  # contracts jobs already lint the code they execute.
  workflow-lint:
    name: Workflow YAML Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Download actionlint
        run: bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) 1.7.7

      - name: Validate workflow YAML
        run: ./actionlint -color -shellcheck=

  # Summary job that requires all checks to pass
  ci-success:
    name: CI Success
    needs: [frontend, contracts, security, rust-security, test-naming, workflow-lint, action-pins]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()

    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ needs.frontend.result }}" != "success" ]]; then
            echo "Frontend job failed"
            exit 1
          fi
          if [[ "${{ needs.contracts.result }}" != "success" ]]; then
            echo "Contracts job failed"
            exit 1
          fi
          if [[ "${{ needs.security.result }}" != "success" ]]; then
            echo "Secret scan failed"
            exit 1
          fi
          if [[ "${{ needs.rust-security.result }}" != "success" ]]; then
            echo "Rust security job failed"
            exit 1
          fi
          if [[ "${{ needs.test-naming.result }}" != "success" ]]; then
            echo "Test naming job failed"
            exit 1
          fi
          if [[ "${{ needs.workflow-lint.result }}" != "success" ]]; then
            echo "Workflow lint job failed"
            exit 1
          fi
          if [[ "${{ needs.action-pins.result }}" != "success" ]]; then
            echo "Workflow action pins job failed"
            exit 1
          fi
          echo "All required checks passed!"
